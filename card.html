<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>shoping cart</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-5 font-sans"              >
<h1 class="text-3xl font-bold mb-6" >Shopping cart </h1>
<div  class="cart-item flex items-center gap-4 mb-5">
  <h3 class="text-xl"> produit 1</h3>
  <button class="minus1 bg-red-500 text-white w-8 h-8 rounded">-</button>
  <span class="quantity1 text-xl w-8 text-center">1</span>
  <button class="plus1 bg-green-500 text-white w-8 h-8 rounded">+</button>
  <button class="like1 text-2xl">❤️</button>
  <button class="delete1 bg-gray-800 text-white px-2 py-1 rounded">delete</button>

</div>
<h2 class="text-2xl font-bold">Total 
  <span class="total-price">1000</span>DA 
</h2>
<script src="reponse.js"></script>
</body>
</html>
